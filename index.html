<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestSurvey Builder</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar Navigation (8 Modules) -->
    <aside class="sidebar" aria-label="Main Navigation">
      <div class="sidebar-brand">
        <div class="brand-icon" aria-hidden="true">TS</div>
        <div class="brand-text">
          <span class="brand-title">TestSurvey Builder</span>
        </div>
      </div>

      <div class="active-project-box">
        <label for="activeProjectSelect" class="project-select-label">Active Project</label>
        <select id="activeProjectSelect" class="project-select" aria-label="Select active project">
          <option value="">-- No Project --</option>
        </select>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" data-view="dashboard">
          <span class="nav-num">1</span>
          <span class="nav-label">Dashboard</span>
        </button>
        <button type="button" class="nav-item" data-view="projects">
          <span class="nav-num">2</span>
          <span class="nav-label">Projects</span>
        </button>
        <button type="button" class="nav-item" data-view="modules">
          <span class="nav-num">3</span>
          <span class="nav-label">Modules</span>
        </button>
        <button type="button" class="nav-item" data-view="submodules">
          <span class="nav-num">4</span>
          <span class="nav-label">Submodules</span>
        </button>
        <button type="button" class="nav-item" data-view="functionalities">
          <span class="nav-num">5</span>
          <span class="nav-label">Functionalities</span>
        </button>
        <button type="button" class="nav-item" data-view="actions">
          <span class="nav-num">6</span>
          <span class="nav-label">Actions</span>
          <span id="navMissingBadge" class="nav-badge hidden" title="Actions missing Test Type">0</span>
        </button>
        <button type="button" class="nav-item" data-view="templates">
          <span class="nav-num">7</span>
          <span class="nav-label">Templates</span>
        </button>
        <button type="button" class="nav-item nav-item-highlight" data-view="survey">
          <span class="nav-num">8</span>
          <span class="nav-label">Test Survey</span>
          <span class="nav-star" aria-hidden="true">★</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="hierarchy-hint">
          <div class="hierarchy-title">Hierarchy Flow</div>
          <div class="hierarchy-steps">
            Project → Module → Submodule → Functionality → Action
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="page-header">
        <div class="page-header-left">
          <h1 id="pageTitle" class="page-title">Dashboard</h1>
          <p id="pageSubtitle" class="page-subtitle">Overview of your functional testing survey projects</p>
        </div>
        <div id="pageHeaderActions" class="page-header-actions"></div>
      </header>

      <div id="pageBody" class="page-body"></div>
    </main>
  </div>

  <!-- Shared Modal Dialog (Modern <dialog closedby="any">) -->
  <dialog id="appModal" class="app-dialog" closedby="any" aria-labelledby="modalTitle">
    <form id="modalForm" method="dialog" class="dialog-inner" novalidate>
      <header class="dialog-header">
        <h2 id="modalTitle" class="dialog-title">Modal Title</h2>
        <button type="button" id="modalCloseBtn" class="dialog-close" aria-label="Close modal">&times;</button>
      </header>
      <div id="modalBody" class="dialog-body"></div>
      <footer class="dialog-footer">
        <button type="button" id="modalCancelBtn" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="modalSaveBtn" class="btn btn-primary">Save</button>
      </footer>
    </form>
  </dialog>

  <!-- Confirmation Modal Dialog -->
  <dialog id="confirmModal" class="app-dialog app-dialog-sm" closedby="any" aria-labelledby="confirmTitle">
    <div class="dialog-inner">
      <header class="dialog-header">
        <h2 id="confirmTitle" class="dialog-title">Confirm Action</h2>
        <button type="button" id="confirmCloseBtn" class="dialog-close" aria-label="Close confirmation">&times;</button>
      </header>
      <div class="dialog-body">
        <p id="confirmMessage" class="confirm-message"></p>
      </div>
      <footer class="dialog-footer">
        <button type="button" id="confirmCancelBtn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="confirmOkBtn" class="btn btn-danger">Confirm</button>
      </footer>
    </div>
  </dialog>

  <!-- Toast Notifications -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Application Scripts -->
  <script src="js/defaults.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/projects.js"></script>
  <script src="js/views/modules.js"></script>
  <script src="js/views/submodules.js"></script>
  <script src="js/views/functionalities.js"></script>
  <script src="js/views/actions.js"></script>
  <script src="js/views/templates.js"></script>
  <script src="js/views/survey.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
